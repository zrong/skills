[project]
name = "upscale-skill"
version = "0.1.0"
description = "Strict upscale-api client with FileBrowser orchestration"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "pillow>=11.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upscale_cli"]

[project.scripts]
upscale = "upscale_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8.4.0"]
