# 复制到项目根目录的 agent_config.toml，或 ~/.agents/agent_config.toml
# 若项目根目录没有该文件，则脚本会回退到 ~/.agents/agent_config.toml

[video-downloader]
# auto | douyin | wx-channels | yt-dlp
default_backend = "auto"

# 通用下载输出目录（主要给 yt-dlp 使用）
default_output_dir = "~/Downloads/video-downloads"

# 可选：显式指定 yt-dlp 可执行文件；为空时依次检查 skill runtime 和 PATH。
yt_dlp_path = ""

# yt-dlp 在作者目录内使用的相对输出模板。
# Skill 始终在前面添加作者/账号目录，字段回退顺序为：
# uploader -> channel -> creator -> uploader_id -> channel_id -> unknown-author。
# 最终路径示例：default_output_dir/作者名/标题 [ID].扩展名
# 可以增加相对子目录，但不允许绝对路径或 ".."。
yt_dlp_output_template = "%(title)s [%(id)s].%(ext)s"

# 可选：显式指定 douyin-downloader 的配置文件路径
# 为空时使用 .runtime/douyin-downloader/config.yml
# 注意：这里不要存放 cookies。本 skill 只在这里保存路径和默认行为；
# douyin-downloader 的 cookies、browser_fallback、thread 等底层配置
# 仍保存在它自己的 config.yml 中。
# 路径支持 ~、环境变量；相对路径以本 skill 目录为基准。
# 留空时分别使用 .runtime/douyin-downloader 和其中的 config.yml。
douyin_downloader_home = ""
douyin_config_path = ""

# 微信视频号 SPH 分享链接解析服务。
# 填服务根地址即可；末尾的 /api 会被自动清理，避免产生 /api/api。
wx_channels_api_url = "http://127.0.0.1:2022"
wx_channels_timeout_seconds = 30
wx_channels_login_timeout_seconds = 300

# 可选：用于启动本地 wx_channels_download 服务。
# Cookie 不放在本配置中，而是放在 wx_channels_download 自己的 config.yaml。
wx_channels_binary_path = ""
wx_channels_config_path = ""

# 可选：skill 专用的元宝登录浏览器 profile。
# 不要指向日常 Chrome、Edge 或其他浏览器的用户数据目录。
wx_channels_browser_profile_dir = ""

# 可选：热搜榜输出目录
# 为空时使用 default_output_dir/hot_board/
hot_board_output_dir = ""

# 可选：搜索结果输出目录
# 为空时使用 default_output_dir/search/
search_output_dir = ""
