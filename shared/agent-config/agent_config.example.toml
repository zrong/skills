# agent_config.toml 示例模板
#
# 使用方式：
# 1. 将本文件复制到新 skill 根目录，保留文件名 agent_config.example.toml。
# 2. 将 [example-skill] 替换为 SKILL.md 中的 skill 名称。
# 3. 只保留该 skill 支持的配置项，并为必填项、默认值和路径语义添加注释。
# 4. 用户可将对应 section 合并到当前工作目录、skill 目录、Git 项目根目录的
#    agent_config.toml，或全局 ~/.agents/agent_config.toml。
#
# 不要在示例中填写真实密钥，也不要提交实际使用的 agent_config.toml。

[example-skill]
# 必填配置：使用明显的占位值，不要使用可被误认为真实凭据的内容。
base_url = "https://service.example.com"

# 可选配置：注释中写明代码默认值。
output_dir = "~/Downloads/example-skill"

# 敏感配置优先支持环境变量；如允许直接填写，应保持为空。
api_key = ""
api_key_env = "EXAMPLE_SKILL_API_KEY"
