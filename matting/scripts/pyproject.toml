[project]
name = "matting-cli"
version = "26.36.56"
description = "Strict client and automatic method selection for matting-api"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
matting = "matting_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
