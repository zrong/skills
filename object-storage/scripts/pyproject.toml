[project]
name = "object-storage"
version = "0.1.0"
description = "S3-compatible object storage transfers and CDN cache management"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.39,<2",
    "tencentcloud-sdk-python-cdn>=3.0,<4",
]

[project.scripts]
object-storage = "object_storage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.39,<2",
    "pyright>=1.1.403",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["object_storage", "tests"]
