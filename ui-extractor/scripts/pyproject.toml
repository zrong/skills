[project]
name = "ui-extractor"
version = "0.1.0"
description = "Extract UI elements from static images: remove checkerboard or chroma background, separate components, optional perspective correction"
requires-python = ">=3.13"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
