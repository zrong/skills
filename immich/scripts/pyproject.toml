[project]
name = "immich"
version = "0.1.0"
description = "Upload images and videos to Immich server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
immich = "immich.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
