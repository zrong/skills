[project]
name = "dns-manager"
version = "0.1.0"
description = "DNS record management across providers (Tencent Cloud DNSPod first)"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
dns-manager = "dns_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
