[project]
name = "imggen"
version = "26.29.14"
description = "Strict OpenAI, Gemini, and Seedream image generation/editing CLI"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
imggen = "imggen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
